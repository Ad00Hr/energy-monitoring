services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  producer-energy:
    build: ./producer-energy
    container_name: producer-energy
    depends_on:
      - kafka
    volumes:
      - ../data:/app/data

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=energy_db
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  analytics-engine:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    container_name: analytics-engine
    depends_on:
      - kafka
      - timescaledb
    volumes:
      - ../lakehouse:/app/lakehouse
      - ../data:/app/data
    environment:
      - KAFKA_BROKER=kafka:29092
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=password123

  # --- IMAGE OFFICIELLE APACHE ---
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    user: root # Important pour éviter les erreurs de permission Windows
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - '8090:8080' # Interface Web
      - '7077:7077' # Port de connexion
    volumes:
      - ../lakehouse:/lakehouse
      - .:/app

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ../lakehouse:/lakehouse
      - .:/app
    depends_on:
      - spark-master

volumes:
  timescaledb_data: